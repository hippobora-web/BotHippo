[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evengine"
version = "0.1.0"
description = "Deterministic research prototype for event-market data and decision-pipeline experiments."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2,<3",
    "requests>=2,<3",
]

[tool.setuptools.packages.find]
include = ["evengine*"]
namespaces = true
